name: Generate Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Make Gradle Executable
        run: chmod +x android_project/gradlew

      - name: Build Debug APK
        run: |
          cd android_project
          ./gradlew assembleDebug

      - name: Save APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GaruraPay-Installer
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
